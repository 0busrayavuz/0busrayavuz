<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E14" />
      <stop offset="50%" stop-color="#0F2027" />
      <stop offset="100%" stop-color="#09141D" />
    </linearGradient>

    <linearGradient id="teal-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EC4B6" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0" />
      <stop offset="30%" stop-color="#2EC4B6" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="220" rx="16" fill="url(#bg-grad)" stroke="#1F2E3D" stroke-width="1" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="60" r="80" fill="#15616B" opacity="0.25" filter="url(#glow)" />
  <circle cx="780" cy="160" r="100" fill="#2EC4B6" opacity="0.2" filter="url(#glow)" />
  <circle cx="450" cy="110" r="60" fill="#00F2FE" opacity="0.12" filter="url(#glow)" />

  <!-- Top Accent Bar -->
  <path d="M 50 1 L 850 1" stroke="url(#accent-line)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Geometric / Data Grid Accents -->
  <g opacity="0.12" stroke="#2EC4B6" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="180" stroke-dasharray="4 4" />
    <line x1="820" y1="40" x2="820" y2="180" stroke-dasharray="4 4" />
    <circle cx="80" cy="40" r="3" fill="#2EC4B6" />
    <circle cx="80" cy="180" r="3" fill="#2EC4B6" />
    <circle cx="820" cy="40" r="3" fill="#2EC4B6" />
    <circle cx="820" cy="180" r="3" fill="#2EC4B6" />
  </g>

  <!-- Content Container -->
  <!-- Tag / Status Pill -->
  <g transform="translate(325, 30)">
    <rect x="0" y="0" width="250" height="26" rx="13" fill="#112433" stroke="#2EC4B6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#2EC4B6" filter="url(#subtle-glow)"/>
    <text x="30" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2EC4B6" letter-spacing="0.8">DATA SCIENCE &amp; ANALYTICS</text>
  </g>

  <!-- Main Name Header -->
  <text x="450" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    Büşra Yavuz
  </text>

  <!-- Subtitle -->
  <text x="450" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="url(#teal-cyan-grad)" letter-spacing="0.3">
    Computer Engineer  ✦  Data &amp; Machine Learning Enthusiast
  </text>

  <!-- Tagline / Focus -->
  <text x="450" y="182" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8FA6B2" letter-spacing="0.2">
    Transforming complex data into predictive intelligence &amp; scalable engineering solutions
  </text>
</svg>
