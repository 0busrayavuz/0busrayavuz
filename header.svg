<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="50%"  stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Neon Text Glow Filters -->
    <filter id="neon-name" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="6"  result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-sub" x="-15%" y="-60%" width="130%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-line" x="-5%" y="-400%" width="110%" height="900%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hex grid pattern -->
    <pattern id="hex-pattern" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,2 56,16 56,36 30,50 4,36 4,16"
               fill="none" stroke="#2EC4B6" stroke-width="0.4" stroke-opacity="0.15"/>
    </pattern>

    <!-- Radial vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Center glow blob -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2EC4B6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom line gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2EC4B6" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#2EC4B6" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#00F2FE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <!-- Top line gradient -->
    <linearGradient id="top-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00F2FE" stop-opacity="0.7"/>
      <stop offset="70%"  stop-color="#2EC4B6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Hex grid -->
  <rect width="900" height="200" fill="url(#hex-pattern)"/>

  <!-- Center ambient glow -->
  <ellipse cx="450" cy="100" rx="400" ry="120" fill="url(#center-glow)"/>

  <!-- Scattered neon particles -->
  <g fill="#2EC4B6">
    <circle cx="80"  cy="30"  r="1.2" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="75"  r="0.8" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="20"  r="1.0" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="55"  r="0.7" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="40"  r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="5.0s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="22"  r="0.9" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="68"  r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="35"  r="0.8" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="160" r="1.0" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="155" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="50"  cy="110" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="130" r="0.9" opacity="0.7"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#00F2FE">
    <circle cx="400" cy="25"  r="0.8" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="170" r="1.0" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="18"  r="0.7" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Vignette overlay -->
  <rect width="900" height="200" fill="url(#vignette)"/>

  <!-- === TOP ACCENT LINE === -->
  <line x1="0" y1="2" x2="900" y2="2" stroke="url(#top-line-grad)" stroke-width="1.5" filter="url(#neon-line)"/>

  <!-- === MAIN NAME TEXT === -->
  <!-- Glow shadow layer -->
  <text x="450" y="108"
        text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="56"
        font-weight="800"
        fill="#2EC4B6"
        opacity="0.35"
        filter="url(#neon-name)">Büşra Yavuz</text>

  <!-- Main white text with glow -->
  <text x="450" y="108"
        text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="56"
        font-weight="800"
        fill="#FFFFFF"
        filter="url(#neon-name)">Büşra Yavuz</text>

  <!-- === SUBTITLE === -->
  <text x="450" y="148"
        text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15"
        font-weight="500"
        letter-spacing="1.2"
        fill="#2EC4B6"
        filter="url(#neon-sub)">Computer Engineer  ·  Data Science &amp; Analytics  ·  Istanbul</text>

  <!-- === BOTTOM NEON LINE === -->
  <line x1="0" y1="197" x2="900" y2="197" stroke="url(#line-grad)" stroke-width="2" filter="url(#neon-line)"/>
</svg>
