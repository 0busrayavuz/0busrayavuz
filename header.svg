<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>

    <!-- Neon glow filter for name -->
    <filter id="glow-name" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feGaussianBlur stdDeviation="4"  result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Glow filter for subtitle -->
    <filter id="glow-sub" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Hex pattern -->
    <pattern id="hex" x="0" y="0" width="52" height="45" patternUnits="userSpaceOnUse">
      <polygon points="26,2 49,14 49,32 26,44 3,32 3,14"
               fill="none" stroke="#2EC4B6" stroke-width="0.35" stroke-opacity="0.13"/>
    </pattern>

    <!-- Bottom accent gradient -->
    <linearGradient id="line-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2EC4B6" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#2EC4B6"/>
      <stop offset="75%"  stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <!-- Name text gradient: white → cyan -->
    <linearGradient id="name-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#E0FFFE"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>

    <!-- Clip for data stream columns -->
    <clipPath id="canvas">
      <rect width="860" height="160"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="860" height="160" fill="url(#bg)"/>
  <rect width="860" height="160" fill="url(#hex)"/>

  <!-- Ambient center glow -->
  <ellipse cx="430" cy="80" rx="340" ry="90" fill="#1B4F5A" opacity="0.18"/>

  <!-- ─── DATA STREAM COLUMNS (falling chars, SMIL animated) ─── -->
  <g clip-path="url(#canvas)" font-family="'Courier New', monospace" font-size="11" fill="#2EC4B6" opacity="0.28">
    <!-- Column 1 -->
    <text x="18" y="0"><animate attributeName="y" from="-10" to="180" dur="3.4s" repeatCount="indefinite"/>SELECT</text>
    <!-- Column 2 -->
    <text x="72" y="0"><animate attributeName="y" from="-10" to="180" dur="4.1s" begin="0.7s" repeatCount="indefinite"/>0x2EC</text>
    <!-- Column 3 -->
    <text x="126" y="0"><animate attributeName="y" from="-10" to="180" dur="2.9s" begin="1.2s" repeatCount="indefinite"/>model</text>
    <!-- Column 4 -->
    <text x="700" y="0"><animate attributeName="y" from="-10" to="180" dur="3.7s" begin="0.3s" repeatCount="indefinite">JOIN</animate></text>
    <!-- Column 5 -->
    <text x="752" y="0"><animate attributeName="y" from="-10" to="180" dur="4.5s" begin="1.6s" repeatCount="indefinite">train</animate></text>
    <!-- Column 6 -->
    <text x="806" y="0"><animate attributeName="y" from="-10" to="180" dur="3.1s" begin="0.9s" repeatCount="indefinite">1010</animate></text>
    <!-- Column 7 -->
    <text x="180" y="0" opacity="0.15"><animate attributeName="y" from="-10" to="180" dur="5.2s" begin="2.1s" repeatCount="indefinite">predict</animate></text>
    <!-- Column 8 -->
    <text x="648" y="0" opacity="0.15"><animate attributeName="y" from="-10" to="180" dur="4.8s" begin="0.5s" repeatCount="indefinite">WHERE</animate></text>
  </g>

  <!-- Blinking cursor dots (data indicators) -->
  <g fill="#00F2FE">
    <circle cx="60"  cy="22" r="1.5"><animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="22" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="138" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="138" r="1.5"><animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Scattered tiny particles -->
  <g fill="#2EC4B6">
    <circle cx="240" cy="18"  r="1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="140" r="0.9"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="15"  r="1.1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="145" r="0.8"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ─── NAME ─── -->
  <!-- Glow backing -->
  <text x="430" y="92" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="800"
        fill="#2EC4B6" opacity="0.3"
        filter="url(#glow-name)">Büşra Yavuz</text>
  <!-- Main name -->
  <text x="430" y="92" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="800"
        fill="url(#name-g)"
        filter="url(#glow-name)">Büşra Yavuz</text>

  <!-- Cursor blink after name -->
  <rect x="672" y="52" width="3" height="42" rx="1" fill="#2EC4B6">
    <animate attributeName="opacity" values="1;0;1" dur="1.0s" repeatCount="indefinite"/>
  </rect>

  <!-- ─── SUBTITLE ─── -->
  <text x="430" y="128" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="500" letter-spacing="1.5"
        fill="#2EC4B6"
        filter="url(#glow-sub)">Computer Engineer  ·  Data Science &amp; Analytics  ·  Istanbul</text>

  <!-- ─── BOTTOM NEON LINE ─── -->
  <filter id="line-glow" x="-5%" y="-800%" width="110%" height="1700%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <line x1="0" y1="157" x2="860" y2="157"
        stroke="url(#line-g)" stroke-width="2"
        filter="url(#line-glow)"/>
</svg>
